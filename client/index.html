<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08b9aa" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon.svg" />
    <title>CampusEats Local</title>
    <script>
      (function () {
        try {
          var lang = localStorage.getItem('campuseats_lang') || localStorage.getItem('qr_dine_lang') || 'tr';
          var theme = localStorage.getItem('campuseats_theme') || localStorage.getItem('qr_dine_theme') || 'light';
          document.documentElement.lang = lang;
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
